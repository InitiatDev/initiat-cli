name: "Python Setup"
defaults:
  timeout: "15m"
  shell: auto
  continue_on_error: false
  cwd: "."
provision:
  - name: "Verify Python is installed"
    if: '!cmd_ok("python3 --version")'
    print: |
      Python 3 is not installed. Install from https://www.python.org/ or use your package manager:
        macOS: brew install python@3.12
        Linux: sudo apt-get install python3 python3-venv
        Windows: choco install python
setup:
  - name: "Create venv"
    if: file_exists("pyproject.toml") || file_exists("requirements.txt")
    run: python3 -m venv .venv || true
  - name: "Install dependencies (pip)"
    if: file_exists("requirements.txt")
    run: |
      . .venv/bin/activate 2>/dev/null || .venv/Scripts/activate 2>/dev/null || true
      pip install -r requirements.txt
  - name: "Install dependencies (pip install -e .)"
    if: file_exists("pyproject.toml")
    run: |
      . .venv/bin/activate 2>/dev/null || .venv/Scripts/activate 2>/dev/null || true
      pip install -e .
verify:
  - name: "Verify Python"
    run: python3 --version || exit 1
post:
  - name: "Python setup complete"
    print: |
      Python setup complete. Activate venv: source .venv/bin/activate (Unix) or .venv\\Scripts\\activate (Windows)
