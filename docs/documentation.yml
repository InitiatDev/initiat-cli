# Initiat CLI Documentation
# Unified documentation structure with flexible content types
# Offline-first commands (init, setup, docs) do not require an account. Cloud commands (auth, device, project, env, secret) are optional.

metadata:
  version: "0.7.0"
  last_updated: "2025-03-04T00:00:00Z"
  author: "Initiat Team"
  description: "CLI documentation: offline-first (init, setup, docs) then optional cloud (auth, device, project, env, secret)"

sections:
  commands:
    id: "commands"
    title: "CLI Commands"
    type: "commands"
    description: "Complete reference for all CLI commands"
    published: true
    metadata:
      order: 1
      icon: "terminal"
    
  guides:
    id: "guides" 
    title: "Guides & Tutorials"
    type: "guides"
    description: "Step-by-step guides and workflows"
    published: true
    metadata:
      order: 2
      icon: "book-open"
      
  reference:
    id: "reference"
    title: "Reference"
    type: "reference" 
    description: "Quick reference and patterns"
    published: true
    metadata:
      order: 3
      icon: "document-text"

commands:
  init:
    id: "init"
    name: "init"
    category: "init"
    description: "Scaffold .initiat/ in the current repository (offline, no account required)"
    usage: "initiat init"
    arguments: []
    options: []
    examples:
      - description: "Scaffold .initiat/ in current repo"
        command: "initiat init"
    workflow_steps:
      - "Ensures current directory is a git repository"
      - "Creates .initiat/ with config.yml and optional setup/docs templates"
      - "Idempotent; safe to run multiple times"
    metadata:
      difficulty: "beginner"
      estimated_time: "10 seconds"
      offline_first: true

  auth.login:
    id: "auth.login"
    name: "login"
    category: "auth"
    description: "Authenticate with your Initiat account credentials"
    usage: "initiat auth login [--email EMAIL]"
    arguments: []
    options:
      - name: "email"
        short: "e"
        description: "Email address for login (optional, will prompt if not provided)"
        required: false
    examples:
      - description: "Login with email prompt"
        command: "initiat auth login"
      - description: "Login with email specified"
        command: "initiat auth login --email user@example.com"
        output: |
          ✅ Login successful! Registration token expires in 15 minutes.
          💡 Next: Register this device with 'initiat device register <name>'
    workflow_steps:
      - "Prompts for your password (hidden input)"
      - "Authenticates with the Initiat API"
      - "Stores registration token securely in OS keychain"
      - "Displays next steps for device registration"
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  device.register:
    id: "device.register"
    name: "register"
    category: "device"
    description: "Register this device with Initiat to enable secure secret access"
    usage: "initiat device register <device-name>"
    arguments:
      - name: "device-name"
        description: "Human-readable name for this device"
        required: true
    options: []
    examples:
      - description: "Register with descriptive name"
        command: 'initiat device register "my-laptop"'
      - description: "Register work device"
        command: 'initiat device register "work-macbook"'
    workflow_steps:
      - "Generates Ed25519 signing keypair"
      - "Generates X25519 encryption keypair"
      - "Registers device with server using authentication token"
      - "Stores keys securely in system keychain"
      - "Clears temporary authentication token"
    output: |
      🔑 Registering device: my-laptop
      🔑 Generating Ed25519 signing keypair...
      🔒 Generating X25519 encryption keypair...
      📡 Registering device with server...
      🔐 Storing keys securely in system keychain...
      ✅ Device registered successfully!

      Device ID: dev_abc123
      Device Name: my-laptop
      Created: 2024-01-15T10:30:00Z

      🔐 Keys stored securely in system keychain
      💡 Next: Initialize project keys with 'initiat project list'
    metadata:
      difficulty: "beginner"
      estimated_time: "2 minutes"

  device.view:
    id: "device.view"
    name: "view"
    category: "device"
    description: "View local device details including device ID, name, API environment, and key status"
    usage: "initiat device view"
    arguments: []
    options: []
    examples:
      - description: "View local device details"
        command: "initiat device view"
    workflow_steps:
      - "Displays device information stored locally"
      - "Shows device ID, name (if set), API base URL, and key status"
      - "Helps verify you're working with the correct device"
    output: |
      Local Device Details

      Device Name: my-laptop
      Device ID: dev_abc123
      API Base URL: https://www.initiat.dev

      Keys Status:
        ✅ Ed25519 signing key: Present
        ✅ X25519 encryption key: Present
    metadata:
      difficulty: "beginner"
      estimated_time: "5 seconds"

  device.set_name:
    id: "device.set_name"
    name: "set-name"
    category: "device"
    description: "Set or update the device name stored locally"
    usage: "initiat device set-name <device-name>"
    arguments:
      - name: "device-name"
        description: "Human-readable name for this device"
        required: true
    options: []
    examples:
      - description: "Set device name"
        command: 'initiat device set-name "my-laptop"'
      - description: "Update existing device name"
        command: 'initiat device set-name "work-macbook"'
    workflow_steps:
      - "Stores device name locally in the keychain"
      - "Useful if you registered before device names were stored locally"
      - "Allows backfilling device names for existing registrations"
    output: |
      ✅ Device name set to: my-laptop
    metadata:
      difficulty: "beginner"
      estimated_time: "10 seconds"

  device.unregister:
    id: "device.unregister"
    name: "unregister"
    category: "device"
    description: "Clear local device credentials from the system keychain"
    usage: "initiat device unregister"
    arguments: []
    options: []
    examples:
      - description: "Unregister device (with confirmation)"
        command: "initiat device unregister"
    workflow_steps:
      - "Displays device details before unregistering"
      - "Prompts for confirmation before clearing credentials"
      - "Removes all device credentials stored locally"
      - "Use when registering a fresh device or cleaning up after server deletion"
    output: |
      ⚠️  You are about to unregister this device:

      Device Details:

      Device Name: my-laptop
      Device ID: dev_abc123
      API Base URL: https://www.initiat.dev

      Keys Status:
        ✅ Ed25519 signing key: Present
        ✅ X25519 encryption key: Present

      Are you sure you want to clear all local device credentials? (y/n): y

      Clearing local device credentials...
      ✅ Device credentials cleared successfully!

      💡 You can now register a new device with 'initiat device register <name>'
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  device.clear_token:
    id: "device.clear_token"
    name: "clear-token"
    category: "device"
    description: "Clear stored authentication token"
    usage: "initiat device clear-token"
    arguments: []
    options: []
    examples:
      - description: "Clear authentication token"
        command: "initiat device clear-token"
    when_to_use:
      - "Getting 'Invalid or expired registration token' errors"
      - "Need to re-authenticate"
    output: |
      🔐 Clearing authentication token...
      ✅ Authentication token cleared successfully!
      💡 You will need to authenticate again for device registration
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  device.approvals:
    id: "device.approvals"
    name: "approvals"
    category: "device"
    description: "List all pending device approvals for projects where you are an admin"
    usage: "initiat device approvals"
    arguments: []
    options: []
    examples:
      - description: "List pending approvals"
        command: "initiat device approvals"
    output: |
      📋 Pending Device Approvals (2)

      ID  User           Device         Project      Requested
      1   John Doe       work-laptop    acme/prod      Jan 15 10:30
      2   Jane Smith     dev-machine    acme/staging   Jan 15 11:45

      💡 Use 'initiat device approve --all' to approve all pending devices
      💡 Use 'initiat device approve --id <id>' to approve a specific device
    metadata:
      difficulty: "intermediate"
      estimated_time: "1 minute"

  device.approve:
    id: "device.approve"
    name: "approve"
    category: "device"
    description: "Approve device access to projects"
    usage: "initiat device approve [--all] [--id ID]"
    arguments: []
    options:
      - name: "all"
        description: "Approve all pending devices"
        required: false
      - name: "id"
        description: "Approve specific device by approval ID"
        required: false
    examples:
      - description: "Approve all pending devices"
        command: "initiat device approve --all"
      - description: "Approve specific device"
        command: "initiat device approve --id 123"
    output: |
      🔐 Approving all pending devices...

      Found 2 pending approvals:
        • work-laptop (acme-corp/production) - John Doe
        • dev-machine (acme-corp/staging) - Jane Smith

      ✅ Approved 2 devices successfully!
         All approved devices can now access their respective project secrets
    metadata:
      difficulty: "intermediate"
      estimated_time: "1 minute"

  device.reject:
    id: "device.reject"
    name: "reject"
    category: "device"
    description: "Reject device access to projects"
    usage: "initiat device reject [--all] [--id ID]"
    arguments: []
    options:
      - name: "all"
        description: "Reject all pending devices"
        required: false
      - name: "id"
        description: "Reject specific device by approval ID"
        required: false
    examples:
      - description: "Reject all pending devices"
        command: "initiat device reject --all"
      - description: "Reject specific device"
        command: "initiat device reject --id 123"
    output: |
      ❌ Rejecting all pending devices...

      Found 2 pending approvals to reject
      ❌ Rejected 2 devices
         Users will need to request approval again
    metadata:
      difficulty: "intermediate"
      estimated_time: "1 minute"

  device.approval:
    id: "device.approval"
    name: "approval"
    category: "device"
    description: "Show detailed information about a specific device approval"
    usage: "initiat device approval --id ID"
    arguments: []
    options:
      - name: "id"
        description: "Device approval ID to show"
        required: true
    examples:
      - description: "Show approval details"
        command: "initiat device approval --id 123"
    output: |
      📋 Device Approval Details

      User: John Doe (john.doe@example.com)
      Device: work-laptop (ID: 456)
      Project: Acme Corp / Production (acme-corp/production)
      Requested: Jan 15 10:30:00Z
      Status: pending

      🔑 Device Public Keys:
        Ed25519: abc123def456... (for signing)
        X25519: def456ghi789... (for encryption)
    metadata:
      difficulty: "intermediate"
      estimated_time: "1 minute"

  project.list:
    id: "project.list"
    name: "list"
    category: "project"
    description: "List all projects and their key initialization status"
    usage: "initiat project list"
    arguments: []
    options: []
    examples:
      - description: "List all projects"
        command: "initiat project list"
    workflow_steps:
      - "Fetches all projects accessible to your account"
      - "Shows key initialization status"
      - "Displays your role in each project"
    output: |
      🔍 Fetching projects...

      Name           Composite Slug      Key Initialized  Role
      Production     acme-corp/prod      ✅ Yes          admin
      Staging        acme-corp/staging   ❌ No           member
      Development    acme-corp/dev       ❌ No           member

      💡 Initialize keys for projects marked "No" using:
         initiat project init <org-slug/project-slug>
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  project.init:
    id: "project.init"
    name: "init"
    category: "project"
    description: "Initialize a new project key for secure secret storage"
    usage: "initiat project init [project-path]"
    arguments:
      - name: "project-path"
        description: "Full project path (org/project) or use flags"
        required: false
    options:
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "Using positional argument"
        command: "initiat project init acme-corp/production"
      - description: "Using flags"
        command: "initiat project init --org acme-corp --project production"
      - description: "Using short flags"
        command: "initiat project init --org acme-corp -p production"
      - description: "Project only (uses default org)"
        command: "initiat project init --project production"
    workflow_steps:
      - "Generates secure 256-bit project key"
      - "Encrypts project key with your device's X25519 key"
      - "Uploads encrypted key to server"
      - "Enables secret storage and retrieval for this project"
    output: |
      🔐 Initializing project key for "acme-corp/production"...
      ⚡ Generating secure 256-bit project key...
      🔒 Encrypting project key with your device's X25519 key...
      📡 Uploading encrypted key to server...
      ✅ Project key initialized successfully!
      🎯 You can now store and retrieve secrets in this project.

      Next steps:
        • Add secrets: initiat secret set API_KEY --value your-secret
        • List secrets: initiat secret list
        • Invite devices: initiat project invite-device
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  project.setup:
    id: "project.setup"
    name: "setup"
    category: "project"
    description: "Run the setup script from .initiat/setup.yml to configure the development environment"
    usage: "initiat project setup"
    arguments: []
    options: []
    examples:
      - description: "Run setup script"
        command: "initiat project setup"
    workflow_steps:
      - "Reads and parses .initiat/setup.yml"
      - "Validates the setup configuration against the schema"
      - "Fetches required secrets from Initiat (if needed)"
      - "Executes the setup script (installs tools, runtimes, databases, etc.)"
      - "Runs all phases sequentially (bootstrap → provision → setup → verify → post)"
    prerequisites:
      - "Must be inside a git repository"
      - "Project context must be initialized (.initiat/config.yml must exist)"
      - "Device must be registered and approved for the project"
    output: |
      📋 Loading setup script from .initiat/setup.yml...
      🔍 Validating setup configuration...
      ✅ Setup configuration is valid
      🚀 Executing setup script...

      [bootstrap phase]
        ✓ Ensuring package manager...
        ✓ Ensuring git...

      [provision phase]
        ✓ Installing Node.js runtime...
        ✓ Ensuring PostgreSQL database...

      [setup phase]
        ✓ Installing dependencies...
        ✓ Running migrations...

      [verify phase]
        ✓ Verifying installation...

      [post phase]
        ✓ Setup complete!

      ✅ Setup completed successfully!
    metadata:
      difficulty: "intermediate"
      estimated_time: "5-15 minutes"
      related_docs:
        - "See Setup Scripts Documentation (SETUP_SCRIPTS.md) for complete syntax reference"

  env.init:
    id: "env.init"
    name: "init"
    category: "env"
    description: "Initialize environment management in the current project directory"
    usage: "initiat env init"
    arguments: []
    options: []
    examples:
      - description: "Initialize environment management"
        command: "initiat env init"
    workflow_steps:
      - "Creates .initiat directory structure for local environment management"
      - "Sets up environment-specific secret storage"
      - "Configures .gitignore to exclude environment files"
      - "Generates .envrc file for automatic environment loading with direnv"
    output: |
      🔧 Initializing environment management...
      📁 Creating .initiat directory structure...
      🔒 Setting up secure environment storage...
      📝 Configuring .gitignore for environment files...
      ✅ Environment management initialized successfully!

      💡 Next steps:
        • Switch to an environment: initiat env switch <env>
        • List available environments: initiat env list
        • Sync secrets: initiat env sync
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  env.list:
    id: "env.list"
    name: "list"
    category: "env"
    description: "List all available environments with their sync status and last updated information"
    usage: "initiat env list"
    arguments: []
    options: []
    examples:
      - description: "List all environments"
        command: "initiat env list"
    workflow_steps:
      - "Shows all environments available in the project"
      - "Displays sync status (whether secrets have been synced)"
      - "Shows last sync time for each environment"
      - "Indicates which environment is currently active"
    output: |
      🌍 Available Environments

      Name        Status    Last Synced    Active
      production  synced    2h ago         ✅
      staging     synced    1d ago         
      development synced    3h ago         

      💡 Switch environments with: initiat env switch <env>
      💡 Sync secrets with: initiat env sync
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  env.switch:
    id: "env.switch"
    name: "switch"
    category: "env"
    description: "Switch to a specific environment and update the active environment tracking"
    usage: "initiat env switch <environment>"
    arguments:
      - name: "environment"
        description: "Name of the environment to switch to"
        required: true
    options: []
    examples:
      - description: "Switch to production environment"
        command: "initiat env switch production"
      - description: "Switch to staging environment"
        command: "initiat env switch staging"
      - description: "Switch to development environment"
        command: "initiat env switch development"
    workflow_steps:
      - "Updates the active environment tracking"
      - "Creates environment-specific directory if needed"
      - "Updates symlinks (Unix) or files (Windows) for environment tracking"
      - "Shows confirmation of the switch"
    output: |
      🔄 Switching to environment 'production'...
      ✅ Switched to environment 'production'

      💡 Current environment: production
      💡 Sync secrets with: initiat env sync
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  env.current:
    id: "env.current"
    name: "current"
    category: "env"
    description: "Show the currently active environment"
    usage: "initiat env current"
    arguments: []
    options: []
    examples:
      - description: "Show current environment"
        command: "initiat env current"
    workflow_steps:
      - "Displays the name of the currently active environment"
      - "Shows when the environment was last switched"
      - "Provides helpful next steps"
    output: |
      🌍 Current Environment: production
      📅 Last switched: 2 hours ago

      💡 Available commands:
        • Switch environment: initiat env switch <env>
        • List environments: initiat env list
        • Sync secrets: initiat env sync
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  env.sync:
    id: "env.sync"
    name: "sync"
    category: "env"
    description: "Sync secrets from the remote project to the local environment"
    usage: "initiat env sync"
    arguments: []
    options: []
    examples:
      - description: "Sync secrets to current environment"
        command: "initiat env sync"
    workflow_steps:
      - "Fetches all secrets from the remote project"
      - "Stores them securely in the local environment directory"
      - "Updates sync timestamps"
      - "Shows summary of synced secrets"
    output: |
      🔄 Syncing secrets to environment 'production'...
      📡 Fetching secrets from remote project...
      🔒 Storing secrets securely in local environment...
      ✅ Synced 5 secrets to environment 'production'

      Synced secrets:
        • API_KEY
        • DB_PASSWORD
        • JWT_SECRET
        • REDIS_URL
        • SMTP_PASSWORD

      💡 Environment is now up to date
      💡 Use 'initiat env current' to verify active environment
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  env.unset:
    id: "env.unset"
    name: "unset"
    category: "env"
    description: "Clear the currently active environment and reload direnv"
    usage: "initiat env unset"
    arguments: []
    options: []
    examples:
      - description: "Clear the active environment"
        command: "initiat env unset"
    workflow_steps:
      - "Checks if environment management is initialized"
      - "Verifies there's an active environment to unset"
      - "Removes the active environment tracking (symlink or file)"
      - "Runs direnv reload to clear environment variables"
      - "Shows confirmation of the unset operation"
    output: |
      🔄 Unsetting active environment...
      🧹 Clearing environment tracking...
      🔄 Running direnv reload...
      ✅ Environment unset successfully!

      💡 No environment is currently active
      💡 Switch to an environment with: initiat env switch <env>
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  code.analyze:
    id: "code.analyze"
    name: "analyze"
    category: "code"
    description: "Parse source files with Tree-sitter and output a generic AST (AST-v1)"
    usage: "initiat code analyze [path]"
    arguments:
      - name: "path"
        description: "File or directory to analyze (optional; default: current directory)"
        required: false
    options:
      - name: "lang"
        description: "Language to parse (auto, go, javascript, typescript, python, ruby, elixir)"
        required: false
      - name: "format"
        description: "Output format (json or jsonl)"
        required: false
      - name: "output"
        short: "o"
        description: "Write output to file instead of stdout"
        required: false
      - name: "recursive"
        description: "Recurse into subdirectories when path is a directory"
        required: false
      - name: "max-bytes"
        description: "Skip files larger than this many bytes (0 disables)"
        required: false
      - name: "fail-on-error"
        description: "Exit non-zero if any parse errors are found"
        required: false
    examples:
      - description: "Analyze current directory (auto-detect languages)"
        command: "initiat code analyze"
      - description: "Analyze a directory and write JSONL to a file"
        command: "initiat code analyze . --format jsonl --output ast.jsonl"
      - description: "Analyze a single file"
        command: "initiat code analyze path/to/main.go --lang go"
    workflow_steps:
      - "Walks files (skipping gitignored paths, deps/build dirs, and tests)"
      - "Parses files with Tree-sitter and normalizes to AST-v1"
      - "Streams JSON or JSONL to stdout or --output file"
    metadata:
      difficulty: "intermediate"
      estimated_time: "seconds to minutes"

  setup.generate:
    id: "setup.generate"
    name: "generate"
    category: "setup"
    description: "Detect language/framework in the current directory and write .initiat/setup.yml and .initiat/config.yml from templates"
    usage: "initiat setup generate [--force]"
    arguments: []
    options:
      - name: "force"
        short: "f"
        description: "Overwrite existing .initiat/setup.yml"
        required: false
    examples:
      - description: "Generate setup and config from detected project"
        command: "initiat setup generate"
      - description: "Overwrite existing setup file"
        command: "initiat setup generate --force"
    workflow_steps:
      - "Scans current directory for stack markers (go.mod, package.json, mix.exs, Gemfile, etc.)"
      - "Loads and merges matching templates (Go, Node, Python, Phoenix, Rails, Docker)"
      - "Infers database/Redis steps from dependencies or Docker Compose"
      - "Writes .initiat/setup.yml and .initiat/config.yml"
    output: |
      Wrote .initiat/setup.yml
      Wrote .initiat/config.yml
      Run: initiat setup validate && initiat setup run
    metadata:
      difficulty: "beginner"
      estimated_time: "10 seconds"
      related_docs:
        - "See Setup Scripts Documentation (SETUP_SCRIPTS.md) and COMMANDS.md"

  setup.run:
    id: "setup.run"
    name: "run"
    category: "setup"
    description: "Run .initiat/setup.yml (offline; no project context required). Fails if the script requires secrets."
    usage: "initiat setup run [setup-file]"
    arguments:
      - name: "setup-file"
        description: "Path to setup file (optional, defaults to .initiat/setup.yml)"
        required: false
    options: []
    examples:
      - description: "Run default setup file"
        command: "initiat setup run"
      - description: "Run specific file"
        command: "initiat setup run .initiat/setup.yml"
    workflow_steps:
      - "Reads and parses the setup YAML file"
      - "Validates the configuration against the schema"
      - "Executes phases in order (bootstrap → provision → setup → verify → post)"
    output: |
      📋 Loading setup script from .initiat/setup.yml...
    metadata:
      difficulty: "beginner"
      estimated_time: "1-15 minutes"
      related_docs:
        - "See Setup Scripts Documentation (SETUP_SCRIPTS.md)"

  setup.validate:
    id: "setup.validate"
    name: "validate"
    category: "setup"
    description: "Validate a setup script YAML file against the schema"
    usage: "initiat setup validate [setup-file]"
    arguments:
      - name: "setup-file"
        description: "Path to setup file (optional, defaults to .initiat/setup.yml)"
        required: false
    options: []
    examples:
      - description: "Validate default setup file"
        command: "initiat setup validate"
      - description: "Validate specific file"
        command: "initiat setup validate .initiat/setup.yml"
      - description: "Validate custom file"
        command: "initiat setup validate custom-setup.yml"
    workflow_steps:
      - "Reads and parses the setup YAML file"
      - "Validates against JSON Schema"
      - "Performs additional Go-specific validation (secret references, path safety, etc.)"
      - "Shows detailed errors if validation fails"
    output_success: |
      Validating .initiat/setup.yml...
      ✅ Setup script is valid!
    output_error: |
      Validating .initiat/setup.yml...
      ❌ Validation failed:
        - version: must be 1
        - setup[0].ensure_runtime: install configuration is required
        - setup[0].secrets: secret 'FOO' not declared in env.secrets
    use_cases:
      - "Validate setup scripts before committing"
      - "Check setup scripts in CI/CD pipelines"
      - "Debug setup script issues"
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"
      related_docs:
        - "See Setup Scripts Documentation (SETUP_SCRIPTS.md) for syntax details"

  setup.schema:
    id: "setup.schema"
    name: "schema"
    category: "setup"
    description: "Output the JSON Schema for .initiat/setup.yml files"
    usage: "initiat setup schema [--output FILE]"
    arguments: []
    options:
      - name: "output"
        short: "o"
        description: "Save schema to file instead of stdout"
        required: false
    examples:
      - description: "Output schema to stdout"
        command: "initiat setup schema"
      - description: "Save schema to file"
        command: "initiat setup schema --output schemas/setup-v1.json"
        output: |
          ✅ Schema saved to schemas/setup-v1.json
    workflow_steps:
      - "Generates JSON Schema v7 for setup scripts"
      - "Outputs to stdout (default) or saves to file"
      - "Schema includes all action types, validation rules, and constraints"
    output: |
      {
        "$schema": "http://json-schema.org/draft-07/schema#",
        "title": "Setup Script Schema",
        "type": "object",
        "properties": {
          "version": {
            "type": "integer",
            "const": 1
          },
          ...
        }
      }
    use_cases:
      - "Generate schema for IDE autocomplete support"
      - "Distribute schema separately (e.g., in separate repo)"
      - "Validate setup files in other languages/tools"
      - "Document the setup script format programmatically"
    metadata:
      difficulty: "beginner"
      estimated_time: "10 seconds"
      related_docs:
        - "See Setup Scripts Documentation (SETUP_SCRIPTS.md) for complete syntax reference"

  secret.set:
    id: "secret.set"
    name: "set"
    category: "secret"
    description: "Set a secret value in the specified project"
    usage: "initiat secret set <secret-key> --value VALUE [options]"
    arguments:
      - name: "secret-key"
        description: "The key/name for the secret"
        required: true
    options:
      - name: "value"
        short: "v"
        description: "Secret value"
        required: true
      - name: "description"
        short: "d"
        description: "Optional description for the secret"
        required: false
      - name: "force"
        short: "f"
        description: "Overwrite existing secret without confirmation"
        required: false
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "Set secret with full project path"
        command: 'initiat secret set API_KEY --value "sk-1234567890abcdef" --project-path acme-corp/production'
      - description: "Set secret with separate org/project"
        command: 'initiat secret set DB_PASSWORD --org acme-corp --project production --value "super-secret-pass" --description "Production database password"'
      - description: "Set secret with short flags"
        command: 'initiat secret set API_KEY -P acme-corp/production -v "sk-1234567890abcdef"'
      - description: "Force overwrite existing secret"
        command: 'initiat secret set API_KEY -p production -v "new-value" --force'
    workflow_steps:
      - "Validates secret key and value"
      - "Retrieves project key from server"
      - "Encrypts secret value client-side"
      - "Uploads encrypted secret to server"
      - "Shows confirmation with metadata"
    output: |
      🔐 Setting secret 'API_KEY' in project acme-corp/production...
      🔒 Encrypting secret value...
      📡 Uploading encrypted secret to server...
      ✅ Secret 'API_KEY' set successfully!
         Version: 1
         Updated: 2024-01-15T10:30:00Z
         Created by: my-laptop
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  secret.get:
    id: "secret.get"
    name: "get"
    category: "secret"
    description: "Get and decrypt a secret value from the specified project"
    usage: "initiat secret get <secret-key> [options]"
    arguments:
      - name: "secret-key"
        description: "The key/name for the secret"
        required: true
    options:
      - name: "copy"
        short: "c"
        description: "Copy value to clipboard instead of printing"
        required: false
      - name: "copy-kv"
        description: "Copy KEY=VALUE format to clipboard"
        required: false
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "Get secret with full project path"
        command: "initiat secret get API_KEY --project-path acme-corp/production"
      - description: "Get secret with short flags"
        command: "initiat secret get API_KEY -P acme-corp/production"
      - description: "Get secret and copy value to clipboard"
        command: "initiat secret get API_KEY -p production --copy"
      - description: "Get secret and copy KEY=VALUE format to clipboard"
        command: "initiat secret get API_KEY -p production --copy-kv"
    workflow_steps:
      - "Retrieves encrypted secret from server"
      - "Gets project key and decrypts it"
      - "Decrypts secret value client-side"
      - "Outputs JSON with secret metadata (default)"
      - "Optionally copies value to clipboard (--copy)"
      - "Optionally copies KEY=VALUE format to clipboard (--copy-kv)"
    output: |
      🔍 Getting secret 'API_KEY' from project acme-corp/production...
      🔓 Decrypting secret value...
      {
        "key": "API_KEY",
        "value": "sk-1234567890abcdef",
        "version": 1,
        "project_id": "ws_abc123",
        "updated_at": "2024-01-15T10:30:00Z",
        "created_by_device": "my-laptop"
      }
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  secret.list:
    id: "secret.list"
    name: "list"
    category: "secret"
    description: "List all secrets in the specified project (metadata only, no values)"
    usage: "initiat secret list [options]"
    arguments: []
    options:
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "List secrets with full project path"
        command: "initiat secret list --project-path acme-corp/production"
      - description: "List secrets with short flags"
        command: "initiat secret list -P acme-corp/production"
      - description: "List secrets with project only"
        command: "initiat secret list --project production"
    workflow_steps:
      - "Fetches all secrets for the project"
      - "Displays metadata in table format"
      - "Shows key, encrypted status, and version"
      - "Never exposes actual secret values"
    output: |
      🔍 Listing secrets in project acme-corp/production...

      Key        Value        Version
      API_KEY    [encrypted]  1
      DB_PASS    [encrypted]  1
      JWT_SECRET [encrypted]  2
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  secret.delete:
    id: "secret.delete"
    name: "delete"
    category: "secret"
    description: "Delete a secret from the specified project"
    usage: "initiat secret delete <secret-key> [options]"
    arguments:
      - name: "secret-key"
        description: "The key/name for the secret"
        required: true
    options:
      - name: "force"
        short: "f"
        description: "Skip confirmation prompt"
        required: false
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "Delete secret with confirmation"
        command: "initiat secret delete API_KEY --project-path acme-corp/production"
      - description: "Delete secret with short flags"
        command: "initiat secret delete API_KEY -P acme-corp/production"
      - description: "Force delete without confirmation"
        command: "initiat secret delete OLD_API_KEY --project production --force"
    workflow_steps:
      - "Prompts for confirmation (unless --force is used)"
      - "Deletes secret from server"
      - "Shows confirmation message"
    output: |
      ⚠️  Are you sure you want to delete secret 'API_KEY' from project acme-corp/production? (y/N): y
      🗑️  Deleting secret 'API_KEY' from project acme-corp/production...
      ✅ Secret 'API_KEY' deleted successfully!
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  secret.export:
    id: "secret.export"
    name: "export"
    category: "secret"
    description: "Export a secret value to a file"
    usage: "initiat secret export <secret-key> --output FILE [options]"
    arguments:
      - name: "secret-key"
        description: "The key/name for the secret"
        required: true
    options:
      - name: "output"
        description: "Output file path"
        required: true
      - name: "force"
        short: "f"
        description: "Overwrite existing key without confirmation"
        required: false
      - name: "project-path"
        short: "P"
        description: "Full project path (org/project) or alias"
        required: false
      - name: "project"
        short: "p"
        description: "Project name (uses default org or --org)"
        required: false
      - name: "org"
        description: "Organization slug (used with --project)"
        required: false
    examples:
      - description: "Export secret to a file"
        command: "initiat secret export API_KEY --output .env --project-path acme-corp/production"
      - description: "Export to deep directory (creates folders)"
        command: "initiat secret export API_KEY --output config/secrets.env -P acme-corp/production"
      - description: "Export with force override"
        command: "initiat secret export API_KEY --output secrets.txt --force"
    workflow_steps:
      - "Retrieves and decrypts secret from server"
      - "Creates output directory if it doesn't exist"
      - "Checks for existing key in file (prompts if found)"
      - "Writes secret in KEY=VALUE format"
      - "Detects git repository and suggests .gitignore"
    output: |
      🔍 Getting secret 'API_KEY' from project acme-corp/production...
      🔓 Decrypting secret value...
      ⚠️  File 'secrets.env' is not in .gitignore. Add it? (y/N): y
      ✅ Added 'secrets.env' to .gitignore
      ✅ Secret 'API_KEY' exported to secrets.env
    metadata:
      difficulty: "beginner"
      estimated_time: "1 minute"

  config.set:
    id: "config.set"
    name: "set"
    category: "config"
    description: "Set a configuration value using dot notation for nested keys"
    usage: "initiat config set <key> <value>"
    arguments:
      - name: "key"
        description: "Configuration key to set"
        required: true
      - name: "value"
        description: "Value to set"
        required: true
    options: []
    examples:
      - description: "Set API URL"
        command: 'initiat config set api.url "https://www.initiat.dev"'
      - description: "Set API timeout"
        command: 'initiat config set api.timeout "60s"'
      - description: "Set default organization"
        command: 'initiat config set org "my-company"'
      - description: "Set default project"
        command: 'initiat config set project "production"'
      - description: "Set service name"
        command: 'initiat config set service "my-custom-service"'
    output: |
      ✅ Set api.url = https://www.initiat.dev
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  config.get:
    id: "config.get"
    name: "get"
    category: "config"
    description: "Get a configuration value using dot notation for nested keys"
    usage: "initiat config get <key>"
    arguments:
      - name: "key"
        description: "Configuration key to get"
        required: true
    options: []
    examples:
      - description: "Get API URL"
        command: "initiat config get api.url"
      - description: "Get default organization"
        command: "initiat config get org"
      - description: "Get default project"
        command: "initiat config get project"
    output: |
      api.url: https://www.initiat.dev
      org: my-company
      project: production
    metadata:
      difficulty: "beginner"
      estimated_time: "30 seconds"

  config.show:
    id: "config.show"
    name: "show"
    category: "config"
    description: "Show all current configuration values"
    usage: "initiat config show"
    arguments: []
