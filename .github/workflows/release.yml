name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0). Optional when running on tag push."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs_on: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: tar.gz
          - name: linux-arm64
            runs_on: ubuntu-latest
            goos: linux
            goarch: arm64
            archive: tar.gz
            cross_cc: aarch64-linux-gnu-gcc
            cross_pkgs: gcc-aarch64-linux-gnu
          - name: darwin-amd64
            runs_on: macos-13
            goos: darwin
            goarch: amd64
            archive: tar.gz
          - name: darwin-arm64
            runs_on: macos-14
            goos: darwin
            goarch: arm64
            archive: tar.gz
          - name: windows-amd64
            runs_on: windows-latest
            goos: windows
            goarch: amd64
            archive: zip

    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev ${{ matrix.cross_pkgs }}

      - name: Install MSYS2 (Windows CGO)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cross_cc }}
        run: |
          mkdir -p dist
          out="dist/initiat-${GOOS}-${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            out="${out}.exe"
          fi
          version="${{ github.event.inputs.version }}"
          if [ -z "$version" ]; then
            version="${GITHUB_REF_NAME}"
          fi
          go build -ldflags "-X github.com/InitiatDev/initiat-cli/cmd.version=${version}" -o "$out" .

      - name: Archive
        shell: bash
        if: runner.os != 'Windows'
        run: |
          cd dist
          tar -czf "initiat-${{ matrix.name }}.tar.gz" "initiat-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/initiat-${{ matrix.goos }}-${{ matrix.goarch }}.exe" -DestinationPath "dist/initiat-${{ matrix.name }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: initiat-${{ matrix.name }}
          path: dist/initiat-${{ matrix.name }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten dist
        shell: bash
        run: |
          mkdir -p release
          find dist -maxdepth 3 -type f \( -name "initiat-*.tar.gz" -o -name "initiat-*.zip" \) | while read -r f; do
            cp "$f" release/
          done
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          files: release/*
